[platformio]
default_envs = esp32-s3-balloon

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Monitor options
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upload options
upload_speed = 921600
upload_protocol = esptool

; Build flags for camera support and PSRAM
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_ESP_LOG
    -DBOARD_HAS_PSRAM
    -DCAMERA_MODEL_ESP32S3_EYE
    -DCAMERA_REQUIRES_PSRAM=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    
; Partition scheme with 3MB APP space as required
board_build.partitions = partitions.csv

; Libraries
lib_deps =
    espressif/esp32-camera@^2.0.4
    bblanchon/ArduinoJson@^6.21.3
    adafruit/Adafruit BMP280 Library@^2.1.0
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    mikalhart/TinyGPSPlus@^1.0.3

; Build type
build_type = release

; Source filter - exclude files with SPI LoRa dependencies
build_src_filter =
    -<main.cpp>
    -<test_*.cpp>
    -<test_oled_lora.cpp>
    -<test_simple.cpp>
    -<lora_comm.cpp>
    -<balloon_instances.cpp>
    -<main_balloon.cpp>
    +<test_minimal.cpp>

; Debug options
debug_tool = esp-prog
debug_init_break = tbreak setup

; ESP32-S3 specific settings
board_build.arduino.memory_type = qio_opi
board_build.arduino.flash_size = 16MB
board_build.arduino.psram_type = opi

; ===========================
; Balloon Firmware Build
; ===========================
[env:esp32-s3-balloon]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Main source file for balloon firmware
build_src_filter =
    +<*>
    -<main.cpp>
    -<test_*.cpp>
    -<lora_comm.cpp>     ; TODO: Rewrite for E32 UART module
    -<balloon_instances.cpp>  ; Depends on lora_comm.cpp
    -<test_oled_lora.cpp>
    -<test_simple.cpp>
    -<test_minimal.cpp>
    -<main_basestation.cpp>
    -<command_sender.cpp>
    -<image_rx_manager.cpp>
    -<sd_storage.cpp>     ; base-only SD persistence module (IMG-05)
    -<trajectory_buffer.cpp>  ; base-only full-flight track ring (WEB-02/D-38)
    -<alert_engine.cpp>  ; base-only alert engine (ALRT-01..06 / D-41..D-44)
    -<wifi_manager.cpp>  ; base-only WiFi mode manager (WEB-05/D-40)
    +<main_balloon.cpp>
    +<stubs.cpp>

; Monitor options
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upload options
upload_speed = 921600
upload_protocol = esptool

; Build flags for balloon firmware
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_ESP_LOG
    -DBOARD_HAS_PSRAM
    -DCAMERA_MODEL_ESP32S3_EYE
    -DCAMERA_REQUIRES_PSRAM=1
    -DARDUINO_USB_MODE=1
    ; 01-10 bench deviation: CDC off => plain Serial aliases UART0, consolidating
    ; ALL logs (ImageTx/CommandHandler/ImageRx discriminator lines included) onto
    ; the bridge COM port the bench monitors. Test envs keep CDC on.
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; G01_SDMMC_BEGIN_DISABLED (D1 session-21) RETIRED at session-29 (debug
    ; doc section 32): the balloon25/26 deaths are INSIDE the NVS flash write
    ; on the FRESH relocated partition, and the surviving-write config of the
    ; SD era was card-in + SDMMC claimed. Re-arm this flag ONLY for a
    ; writes-none baseline A/B per section 31.3.
    ; G01_ID_COMMIT_IMMEDIATE (D1 session-31, debug doc section 34) A/B arm,
    ; shipped COMMENTED (default OFF = round-#21 behavior identical to #20).
    ; Uncomment for the deferral-timing phase of the session-31 bench: it
    ; restores the capture-time putUShort+commit (the pre-3211fb5 placement)
    ; inside allocateImageId and skips the +1.5 s deferred write — recreating
    ; survivor cell A (old partition, card in, capture-time write) with
    ; current code. Bench phases and pre-written readings: debug doc
    ; section 34.6. Console marker at boot:
    ; "[CAPWIN] G01_ID_COMMIT_IMMEDIATE armed - ...". Removal: with the
    ; G-01-10 instrument family once the bisect verdict lands.
    ; -DG01_ID_COMMIT_IMMEDIATE
    ; FIRMWARE_VERSION / SYSTEM_NAME defined in main_balloon.cpp

; Partition scheme with 3MB APP space as required
board_build.partitions = partitions.csv

; Libraries for balloon firmware
lib_deps =
    espressif/esp32-camera@^2.0.4
    bblanchon/ArduinoJson@^6.21.3
    adafruit/Adafruit BMP280 Library@^2.1.0
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    mikalhart/TinyGPSPlus@^1.0.3
    ; Note: E32-900T30D is UART-based, not using sandeepmistry/LoRa SPI library

; Build type
build_type = release

; Debug options
debug_tool = esp-prog
debug_init_break = tbreak setup

; ESP32-S3 specific settings
board_build.arduino.memory_type = qio_opi
board_build.arduino.flash_size = 16MB
board_build.arduino.psram_type = opi

; ===========================
; OLED + LoRa Test Build
; ===========================
[env:esp32-s3-test-oled-lora]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Only build the test file
build_src_filter =
    +<test_oled_lora.cpp>

; Monitor options
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upload options
upload_speed = 921600
upload_protocol = esptool

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_ESP_LOG
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Libraries for OLED and LoRa testing
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library

; Build type - debug for better error messages
build_type = debug

; ESP32-S3 specific settings
board_build.arduino.memory_type = qio_opi
board_build.arduino.flash_size = 16MB
board_build.arduino.psram_type = opi

