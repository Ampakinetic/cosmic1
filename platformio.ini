; ===========================
; Base Station Firmware (Phase 1)
; ===========================
[env:esp32-s3-basestation]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Build base station firmware
build_src_filter =
    +<*>
    -<main.cpp>
    -<test_*.cpp>
    -<test_oled_lora.cpp>
    -<test_simple.cpp>
    -<test_minimal.cpp>
    -<lora_comm.cpp>
    -<balloon_instances.cpp>
    -<camera_manager.cpp>
    -<packet_handler.cpp>
    -<sensor_manager.cpp>
    -<power_manager.cpp>
    -<system_state.cpp>
    -<main_balloon.cpp>
    -<app_httpd.cpp>
    -<command_handler.cpp>
    -<auto_capture.cpp>
    -<image_tx_manager.cpp>
    -<sd_store_balloon.cpp>  ; balloon-only SD flight-archive store (Phase 2.5, locked decision 5: base firmware unchanged)
    -<stubs.cpp>
    -<debug_utils.cpp>
    +<main_basestation.cpp>

; Monitor options
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upload options
upload_speed = 921600
upload_protocol = esptool

; Build flags for base station
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_ESP_LOG
    -DARDUINO_USB_MODE=1
    ; 01-10 bench deviation: CDC off => plain Serial aliases UART0 (see balloon env)
    -DARDUINO_USB_CDC_ON_BOOT=0

; Libraries for base station
lib_deps =
    adafruit/Adafruit SSD1306        ; OLED status screen (status_display)
    adafruit/Adafruit GFX Library

; Build type
build_type = release

; ESP32-S3 specific settings
board_build.arduino.memory_type = qio_opi
board_build.arduino.flash_size = 16MB
board_build.arduino.psram_type = opi
